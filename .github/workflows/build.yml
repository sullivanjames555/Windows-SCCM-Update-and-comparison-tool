name: Build UpdateHealthKit

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check PowerShell scripts
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { throw "$bad PowerShell parse error(s)" }
          Write-Host 'All PowerShell scripts parse cleanly.'

      - name: Unit-test SCCM AdminService query translation
        shell: powershell
        run: |
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\Analyzer\Invoke-UpdateHealthAnalyzer.ps1).Path, [ref]$null, [ref]$null)
          $fn = $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'ConvertTo-ODataQuery' }, $true) | Select-Object -First 1
          . ([scriptblock]::Create($fn.Extent.Text))
          function E([string]$f) { [Uri]::EscapeDataString($f) }
          $cases = @(
            @("SELECT * FROM SMS_R_System WHERE Name = 'PC123'", ('SMS_R_System?$filter=' + (E "Name eq 'PC123'"))),
            @("SELECT CollectionID, Name FROM SMS_Collection WHERE CollectionID = 'ABC00012' OR CollectionID = 'SMS00001'", ('SMS_Collection?$select=CollectionID,Name&$filter=' + (E "CollectionID eq 'ABC00012' or CollectionID eq 'SMS00001'"))),
            @("SELECT CI_ID, ArticleID FROM SMS_SoftwareUpdate WHERE LocalizedDisplayName LIKE '%Cumulative Update for Windows 11 Version 24H2 for x64-based%' AND IsExpired = false", ('SMS_SoftwareUpdate?$select=CI_ID,ArticleID&$filter=' + (E "contains(LocalizedDisplayName,'Cumulative Update for Windows 11 Version 24H2 for x64-based') and IsExpired eq false"))),
            @("SELECT CI_ID, Status FROM SMS_UpdateComplianceStatus WHERE MachineID = 16777220", ('SMS_UpdateComplianceStatus?$select=CI_ID,Status&$filter=' + (E 'MachineID eq 16777220'))),
            @("SELECT * FROM SMS_R_System WHERE Name = 'O\'BRIEN-PC'", ('SMS_R_System?$filter=' + (E "Name eq 'O''BRIEN-PC'"))),
            @("SELECT * FROM SMS_Site", 'SMS_Site')
          )
          $bad = 0
          foreach ($c in $cases) {
            $got = ConvertTo-ODataQuery $c[0]
            if ($got -ne $c[1]) { Write-Host "::error::WQL: $($c[0])`n  expected: $($c[1])`n  got:      $got"; $bad++ } else { Write-Host "OK  $got" }
          }
          if ($bad) { throw "$bad query translation test(s) failed" }

      - name: End-to-end test (collector -> analyzer -> results window)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'e2e'
          $bundles = Join-Path $work 'bundles'
          New-Item -ItemType Directory -Path $bundles -Force | Out-Null

          # 1. Real collection on this runner (Windows Server 2025, no SCCM client)
          & .\Collector\Invoke-UpdateHealthCollector.ps1 -OutputPath $bundles -Days 7 -NoZip
          $real = Get-ChildItem $bundles -Directory | Where-Object { $_.Name -like "UpdateHealth_$($env:COMPUTERNAME)_*" } | Select-Object -First 1
          if (-not $real -or -not (Test-Path "$($real.FullName)\collection.json")) { throw "Collector did not produce UpdateHealth_$($env:COMPUTERNAME)_<timestamp>\collection.json" }
          Write-Host "Bundle folder name includes hostname: $($real.Name)"
          $json = [IO.File]::ReadAllText("$($real.FullName)\collection.json")

          # 2. Simulated hosts built from the same data, to exercise other OS comparisons
          function New-SimBundle([string]$Name, [hashtable]$Fields) {
            $j = $json
            foreach ($k in $Fields.Keys) {
              $v = $Fields[$k]
              if ($v -is [int]) { $j = $j -replace "(`"$k`"\s*:\s*)\d+", ('${1}' + $v) }
              else { $j = $j -replace "(`"$k`"\s*:\s*)(null|`"[^`"]*`")", ('${1}"' + $v + '"') }
            }
            $dir = Join-Path $bundles "UpdateHealth_${Name}_20990101-000000"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            [IO.File]::WriteAllText("$dir\collection.json", $j)
          }
          New-SimBundle 'CLIENTSIM01' @{ ComputerName = 'CLIENTSIM01'; InstallationType = 'Client'; EditionID = 'Enterprise'; CurrentBuild = 26100; UBR = 4000; DisplayVersion = '24H2'; OSCaption = 'Microsoft Windows 11 Enterprise' }
          New-SimBundle 'SRV2016SIM' @{ ComputerName = 'SRV2016SIM'; InstallationType = 'Server'; EditionID = 'ServerStandard'; CurrentBuild = 14393; UBR = 5000; DisplayVersion = '1607'; OSCaption = 'Microsoft Windows Server 2016 Standard' }

          # A troubled Windows 11 PC with an SCCM client: failed forced scan, pending restart with Fast Startup,
          # stuck msiexec, low disk, update waiting for a maintenance window. Built by editing the JSON object.
          Add-Type -AssemblyName System.Web.Extensions
          $ser = New-Object System.Web.Script.Serialization.JavaScriptSerializer
          $ser.MaxJsonLength = [int]::MaxValue
          $o = $ser.DeserializeObject($json)
          function Set-J($root, [string]$path, $value) {
            $parts = $path.Split('.'); $cur = $root
            for ($i = 0; $i -lt $parts.Count - 1; $i++) {
              if (-not ($cur[$parts[$i]] -is [System.Collections.IDictionary])) { $cur[$parts[$i]] = New-Object 'System.Collections.Generic.Dictionary[string,object]' }
              $cur = $cur[$parts[$i]]
            }
            $cur[$parts[-1]] = $value
          }
          $now = (Get-Date).ToString('yyyy-MM-ddTHH:mm:sszzz')
          $set = [ordered]@{
            'Meta.ComputerName' = 'TROUBLEPC01'; 'System.ComputerName' = 'TROUBLEPC01'; 'System.InstallationType' = 'Client'; 'System.EditionID' = 'Enterprise'
            'System.CurrentBuild' = 26100; 'System.UBR' = 9711; 'System.DisplayVersion' = '24H2'; 'System.OSCaption' = 'Microsoft Windows 11 Enterprise'
            'System.SystemDriveFreeGB' = 6.5; 'System.UptimeDays' = 23
            'PendingReboot.Any' = $true; 'PendingReboot.Reasons' = @('CBS', 'CcmClient')
            'Sccm.Installed' = $true; 'Sccm.ServiceState' = 'Running'; 'Sccm.NamespaceOk' = $true; 'Sccm.SiteCode' = 'ABC'
            'Sccm.ManagementPoint' = 'CM01.corp.example.com'; 'Sccm.ClientVersion' = '5.00.9135.1000'
            'Sccm.SumConfig' = @{ ComponentEnabled = $true }; 'Sccm.UpdateSource' = @{ ContentLocation = 'http://SUP01.corp.example.com:8530' }
            'Sccm.SoftwareCenterUpdates' = @(@{ ArticleID = '5132061'; Name = '2026-11 Cumulative Update for Windows 11 Version 24H2 for x64-based Systems (KB5132061)'; EvaluationState = 14; ErrorCode = 0 })
            'Sccm.LastScanFailure' = $now
            'Sccm.LogSignatures' = @(@{ Id = 'SCAN_FAILED'; Severity = 'High'; Title = 'Software update scan failures'; Hits = 12; FirstSeen = $now; LastSeen = $now; LastLog = 'WUAHandler'; Sample = 'Scan failed with error = 0x80244022.' })
            'WindowsUpdate.Policy.WUServer' = 'http://SUP01.corp.example.com:8530'; 'WindowsUpdate.PolicyAU.UseWUServer' = 1
            'Diagnostics.FastStartup.HiberbootEnabled' = 1
            'Diagnostics.BusyProcesses' = @(@{ Name = 'msiexec'; Id = 4242; StartTime = $now; RunningMinutes = 380; CpuSeconds = 2 })
            'Diagnostics.MsiBusy' = $true
            'Probe' = @{ Ran = $true; Started = $now; Finished = $now; Minutes = 5; ScanResult = 'Failed'; ScanTime = $now; ScanMessage = 'Scan failed with error = 0x80244022.'
                         ScanErrorCodes = @('0x80244022'); PolicyActivity = $true; PolicyErrors = @(); CommErrors = @(); StateMessagesSent = $true; DeploymentEvaluated = $true; ErrorCount = 3
                         Actions = @(@{ Name = 'Software Updates Scan Cycle'; Triggered = $true; Time = $now }); Timeline = @(); SoftwareCenterAfter = @(); MissingAfter = 3 }
          }
          foreach ($k in $set.Keys) { Set-J $o $k $set[$k] }
          $dir = Join-Path $bundles 'UpdateHealth_TROUBLEPC01_20990101-000000'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          [IO.File]::WriteAllText("$dir\collection.json", $ser.Serialize($o))

          # 3. Analyzer on the whole folder; fail on any error record; then the results window self-test
          $out = Join-Path $work 'reports'
          $log = & .\Analyzer\Invoke-UpdateHealthAnalyzer.ps1 -InputPath $bundles -OutputPath $out -GuiTestSeconds 3 *>&1
          $exit = $LASTEXITCODE
          $log | ForEach-Object { Write-Host $_ }
          $failed = $false
          foreach ($e in @($log | Where-Object { $_ -is [System.Management.Automation.ErrorRecord] })) { Write-Host "::error::Analyzer: $($e.Exception.Message) $($e.InvocationInfo.PositionMessage)"; $failed = $true }
          if ($exit) { Write-Host "::error::Analyzer exit code $exit"; $failed = $true }
          if (-not ($log | Where-Object { "$_" -like 'Results window test: OK*' })) { Write-Host '::error::Results window self-test did not complete'; $failed = $true }

          $expect = @{
            'CLIENTSIM01' = 'Windows 11 cumulative update'
            'SRV2016SIM'  = 'Windows Server 2016 cumulative update'
            $env:COMPUTERNAME = 'Windows Server 2025 cumulative update'
            'TROUBLEPC01' = 'Windows 11 cumulative update'
          }
          $files = @(Get-ChildItem $out -Recurse -Filter analysis.json)
          if ($files.Count -ne 4) { Write-Host "::error::expected 4 analysis.json files, found $($files.Count)"; $failed = $true }
          foreach ($f in $files) {
            $a = Get-Content $f.FullName -Raw | ConvertFrom-Json
            foreach ($s in @($a.Findings | Where-Object { $_.Area -eq 'Analyzer' })) { Write-Host "::error::$($a.ComputerName): $($s.Title) - $($s.Detail)"; $failed = $true }
            $md = $a.MicrosoftData
            foreach ($k in 'WindowsVersions', 'WindowsReleaseBuilds', 'ServerVersions', 'ServerReleaseBuilds', 'DotNetChannels') {
              if (-not ($md.$k -gt 0)) { Write-Host "::error::Microsoft data not parsed: $k = $($md.$k)"; $failed = $true }
            }
            if (@($a.Diagnosis).Count -lt 1) { Write-Host "::error::$($a.ComputerName): no diagnosis produced"; $failed = $true }
            else { Write-Host "   Most likely reason: [$($a.Diagnosis[0].Severity)] $($a.Diagnosis[0].Cause)"; foreach ($d in @($a.Diagnosis)) { Write-Host "     - $($d.Cause)  <=  $($d.Evidence)" } }
            if ($a.ComputerName -eq 'TROUBLEPC01') {
              $keys = @($a.Diagnosis | ForEach-Object { $_.Key })
              if ($keys[0] -ne 'SCAN') { Write-Host "::error::TROUBLEPC01: expected the failed scan as the most likely reason, got $($keys[0])"; $failed = $true }
              foreach ($k in 'SCAN', 'MW', 'REBOOT', 'BUSY', 'DISK') { if ($keys -notcontains $k) { Write-Host "::error::TROUBLEPC01: diagnosis is missing cause $k (got $($keys -join ', '))"; $failed = $true } }
            }
            $want = $expect[$a.ComputerName]
            $row = @($a.Updates | Where-Object { $_.Component -eq $want }) | Select-Object -First 1
            if (-not $row -or $row.Status -eq 'Not checked') { Write-Host "::error::$($a.ComputerName): '$want' comparison did not run"; $failed = $true }
            Write-Host ""
            Write-Host "== $($a.ComputerName): $($a.Summary | ConvertTo-Json -Compress)  MS data: $($md | ConvertTo-Json -Compress)"
            foreach ($u in $a.Updates | Where-Object { $_.Component -notmatch '^(\.NET|ASP\.NET) (Runtime|SDK|Desktop|Core)' }) { Write-Host "   $($u.Severity) | $($u.Component) | $($u.Installed) -> $($u.Latest) | $($u.Status)" }
          }
          New-Item -ItemType Directory -Path .\e2e-reports -Force | Out-Null
          Copy-Item "$out\*" .\e2e-reports -Recurse
          $global:LASTEXITCODE = 0
          if ($failed) { throw 'End-to-end test failed (see errors above).' }

      - name: Upload sample reports from the end-to-end test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sample-reports
          path: e2e-reports
          if-no-files-found: ignore

      - name: Package
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'UpdateHealthKit'
          New-Item -ItemType Directory -Path "$stage\Analyzer", "$stage\Collector", "$stage\Build" -Force | Out-Null
          Copy-Item .\Analyzer\Invoke-UpdateHealthAnalyzer.ps1 "$stage\Analyzer\"
          Copy-Item .\Collector\Invoke-UpdateHealthCollector.ps1 "$stage\Collector\"
          Copy-Item .\Build\Build-UpdateHealthKit.ps1 "$stage\Build\"
          Copy-Item .\README.md "$stage\"
          Compress-Archive -Path "$stage\*" -DestinationPath .\UpdateHealthKit.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpdateHealthKit
          path: UpdateHealthKit.zip

      - name: Publish rolling "latest" release (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest --cleanup-tag --yes }
          $notes = "Unsigned build of commit $env:GITHUB_SHA. Sign it before use under AppLocker: .\Build\Build-UpdateHealthKit.ps1"
          gh release create latest .\UpdateHealthKit.zip --target $env:GITHUB_SHA --title "Latest build" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Publish versioned release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME .\UpdateHealthKit.zip --title "UpdateHealthKit $env:GITHUB_REF_NAME" --notes "Unsigned build. Sign it with .\Build\Build-UpdateHealthKit.ps1 before use under AppLocker."
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
